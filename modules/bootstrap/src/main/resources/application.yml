spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/academic
    username: academic
    password: academic
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672

  redis:
    host: localhost
    port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: "changeme-32+chars-secret"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui