spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/academic
    username: academic
    password: academic
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui

# Config do JWT local (gratuito)
app:
  security:
    jwt:
      secret: "${JWT_SECRET:changeme-please-use-32+chars}"
      expiration-seconds: 3600
